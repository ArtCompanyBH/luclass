<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Aulas - Google Meet</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        h2 { color: #007430; margin-bottom: 5px; } /* Verde padrão Google Meet */
        p.sub { color: #5f6368; margin-bottom: 20px; font-size: 14px; }
        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #dadce0;
            font-size: 16px;
            box-sizing: border-box;
        }
        select:focus { border-color: #007430; outline: none; }
        button {
            background-color: #007430;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #005924; }
        .instrucoes {
            font-size: 12px;
            color: #5f6368;
            margin-top: 15px;
            text-align: left;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Painel de Aulas (Meet)</h2>
    <p class="sub">Link fixo configurado para todos os alunos</p>
    
    <label for="aluno">Selecione o Aluno:</label>
    <select id="aluno">
        <option value="" data-whatsapp="5531996946866" data-email="joao@email.com">AROLDO</option>
        <option value="" data-whatsapp="5531991317382" data-email="aroldo@email.com">LUCAS</option>
        <option value="" data-whatsapp="5531988702128" data-email="pedro@email.com">SERGIO</option>
    </select>

    <button onclick="gerarReuniao('whatsapp')">🔮 Abrir Meet e Chamar no WhatsApp</button>
   

    <div class="instrucoes">
        <strong>Como funciona agora:</strong> O Google Meet abrirá na sua sala fixa e o contato selecionado receberá a mensagem com o link de acesso imediatamente. Tudo em um clique.
    </div>
</div>

<script>
function gerarReuniao(metodo) {
    const select = document.getElementById('aluno');
    const opcaoSelecionada = select.options[select.selectedIndex];
    
    const nomeAluno = opcaoSelecionada.text;
    const whatsappAluno = opcaoSelecionada.getAttribute('data-whatsapp');
    const emailAluno = opcaoSelecionada.getAttribute('data-email');
    
    // O seu link fixo do Google Meet
    const urlMeetFixo = "https://meet.google.com/qwd-ayrw-zjm";

    // Mensagem customizada que o aluno vai receber
    const mensagem = `Olá, estou te aguardando para a nossa aula! Pode entrar pela nossa sala fixa no Google Meet: ${urlMeetFixo}`;

    // 1. Abre o canal de comunicação escolhido
    if (metodo === 'whatsapp') {
        const urlWhats = `https://api.whatsapp.com/send?phone=${whatsappAluno}&text=${encodeURIComponent(mensagem)}`;
        window.open(urlWhats, '_blank');
    } else if (metodo === 'email') {
        const urlEmail = `https://mail.google.com/mail/?view=cm&fs=1&to=${emailAluno}&su=${encodeURIComponent('Link da nossa Aula - Google Meet')}&body=${encodeURIComponent(mensagem)}`;
        window.open(urlEmail, '_blank');
    }

    // 2. Abre a sua sala do Meet na Web
    window.open(urlMeetFixo, '_blank');
}
</script>

</body>
</html>
